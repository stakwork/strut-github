title: GitHub
description: Connect your GitHub account. Admins pick which repos agents work on.
icon: git-pull-request
entry: src/App.tsx
grants:
  workflows: []
  # `me` is everyone's; `paste` and `disconnect` change the viewer's own
  # token; `installations` and `repositories` are an admin's, and refuse
  # anyone else. `graph/changes`: the repositories read again when the
  # box's list (stadeum/code's Repository nodes) changes.
  steps: [stadeum/github/me, stadeum/github/paste, stadeum/github/disconnect, stadeum/github/installations, stadeum/github/repositories, graph/changes]
  sqlite: false
  automations: []
